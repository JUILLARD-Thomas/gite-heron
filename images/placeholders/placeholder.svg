<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Image de remplacement</title>
  <desc id="desc">Image temporaire pour le Gîte du Héron</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EFE6"/>
      <stop offset="100%" stop-color="#D4C4A8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" fill="none" stroke="#C2B49A" stroke-width="4" stroke-dasharray="12 12"/>
  <text x="50%" y="48%" text-anchor="middle" fill="#6B8E5A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40">
    Photo à venir
  </text>
  <text x="50%" y="58%" text-anchor="middle" fill="#8B7355" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">
    Le Gîte du Héron
  </text>
</svg>
